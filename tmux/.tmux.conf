set -g default-terminal "tmux-256color"
set -g terminal-features[3] "xterm*:RGB:clipboard"
set -g terminal-features[4] "xterm-ghostty:RGB:clipboard"
set -g terminal-features[5] "ghostty*:RGB:clipboard"
set -g terminal-features[6] "vte*:RGB:clipboard"
set -gu terminal-overrides
set -g terminal-overrides[1] "xterm*:XT:Ms=\\E]52;c;%p1%0.0s%p2%s\\7"
set -g terminal-overrides[2] "ghostty*:XT:Ms=\\E]52;c;%p1%0.0s%p2%s\\7"
set -g terminal-overrides[3] "vte*:XT:Ms=\\E]52;c;%p1%0.0s%p2%s\\7"
set -s escape-time 0
set -s extended-keys on

# Mouse + OSC 52 clipboard support over mosh/SSH.
set -g mouse on
set -g set-clipboard on

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
set -g status-style 'bg=#333333 fg=#5eacd3'

set -g focus-events on

set -g base-index 1

# reset indexing when deleting a window
set -g renumber-windows on

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# When splitting window, new pane is opened in the same directory as the original
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# reload config
bind r source-file ~/.tmux.conf

# DESIGN TWEAKS

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=red'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=red bold'
